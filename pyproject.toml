[project]
name = "ops-automation"
version = "1.0.0"
description = "Platform operations automation: drift remediation, DORA scorecard, alarm-driven runbooks and cost cleanup, with guardrails"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34", "pyyaml>=6"]

[project.optional-dependencies]
demo = ["moto[ec2,ecs,elbv2,cloudformation,dynamodb,sns,cloudwatch]>=5"]
infra = ["aws-cdk-lib>=2.150,<3", "constructs>=10,<11"]
dev = ["ops-automation[demo,infra]", "pytest>=8", "ruff>=0.6"]

[project.scripts]
opsctl = "opsctl.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opsctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["cdk.out", "demo-output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
